let S={name:'',score:0,stars:[0,0,0,0,0],open:1,lv:0,qi:0,hearts:3,maxH:3,extra:0,ok:0,wrong:0,streak:0,qs:[],miss:[],hint:false,t0:0,timer:null,locked:false,pw:{hint:1,time:1}};
let best=0;try{best=+localStorage.getItem('lightBest')||0}catch(e){}
const ts=()=>S.stars.reduce((a,b)=>a+b,0),rank=()=>RANK[[0,2,5,8,11,14].filter(x=>ts()>=x).length-1];
const show=h=>{$('app').innerHTML=h;window.scrollTo(0,0)};
function add(n){S.score+=n;const e=$('sc');if(e){e.textContent=S.score;e.classList.remove('pop');void e.offsetWidth;e.classList.add('pop')}fly('+'+n)}
const hud=()=>`<div class="hud"><span>${star()} ${ts()}</span><span>⭐ <b id="sc">${S.score}</b></span><span aria-label="القلوب">${[...Array(S.maxH)].map((_,i)=>heart(i>=S.hearts)).join('')}</span>${S.streak>=3?'<span>🔥×2</span>':''}<span class="muted">${rank()}</span><button class="alt" style="min-height:38px;font-size:14px;padding:2px 10px" onclick="mute=!mute;this.textContent=mute?'🔇':'🔊'">${mute?'🔇':'🔊'}</button></div>`;
// ===== الشاشات =====
function home(){clearInterval(S.timer);scene(-1);show(`<div class="card" style="align-items:center;text-align:center">${mas('happy','big')}<h1>مغامرة الضوء مع نور</h1><p>أنا نور! يلّا نتعلّم «خصائص الضوء» ونجمع النجوم والجوائز معًا 🎁</p><input type="text" id="nm" placeholder="اكتب اسمك" aria-label="اسمك" maxlength="20" style="width:80%"><button onclick="start()">يلّا نبدأ 🚀</button>${best?`<p class="muted">🏆 رقمك القياسي: ${best}</p>`:''}</div>`)}
function start(){S.name=($('nm').value||'').trim()||'يا بطل';tone([523,659]);map()}
function map(){S.hearts=S.maxH=3+S.extra;scene(-1);const nx=Math.min(S.open,5)-1;
show(`${hud()}<div class="card"><div class="say">${mas('happy')}<div class="bub">أهلًا ${esc(S.name)}! رتبتك: ${rank()}. اختر بابًا من أبواب الضوء.</div></div></div>${L.map((l,i)=>{const lock=i>=S.open;return `<button class="lvl ${lock?'lock':'opt'} ${i===nx&&!S.stars[i]?'new':''}" ${lock?'disabled':''} onclick="lesson(${i})"><span>${lock?'🔒':l.e} المستوى ${i+1}: ${l.n}</span><span>${[0,1,2].map(k=>star(k>=S.stars[i])).join('')}</span></button>`}).join('')}<p class="muted" style="text-align:center">🎁 افتح صندوق الجوائز بعد كل مستوى تنجح فيه!</p>`)}
function lesson(i,k=0){S.lv=i;const l=L[i],last=k>=l.cards.length-1;scene(i);
show(`${hud()}<div class="card"><h2>${l.e} المستوى ${i+1}: ${l.n}</h2><div class="art">${l.cards[k][0]}</div><div class="say">${mas('happy')}<div class="bub">بطاقة ${k+1} من ${l.cards.length}</div></div><p>${l.cards[k][1]}</p><button onclick="${last?(l.mini?`mini(${i})`:'play()'):`lesson(${i},${k+1})`}">${last?(l.mini?'لعبة صغيرة 🎮':'ابدأ الأسئلة'):'التالي'}</button>${last?'<button class="alt" onclick="play()">تخطَّ إلى الأسئلة</button>':''}<button class="alt" onclick="map()">رجوع</button></div>`)}
// ===== لعبة صغيرة: صنّف المصادر / وجّه الشعاع =====
let M={};
function mini(i){L[i].mini==='sort'?(M={i:0,ok:0},sortQ()):beam()}
function sortQ(){if(M.i>=SORT.length){tone([523,659,784]);confetti(40);return show(`${hud()}<div class="card" style="text-align:center;align-items:center">${mas('cheer','big hop')}<h2>أحسنت! صنّفت ${M.ok} من ${SORT.length} بشكل صحيح</h2><button onclick="play()">ابدأ الأسئلة</button></div>`)}
const it=SORT[M.i];show(`${hud()}<div class="card" style="text-align:center"><h2>🎮 صنّف المصادر (${M.i+1}/${SORT.length})</h2><div class="art">${it[1]}</div><h1>${it[0]}</h1><button class="opt" style="justify-content:center" onclick="sortA(0)">🌿 مصدر طبيعي</button><button class="opt" style="justify-content:center" onclick="sortA(1)">🏭 مصدر صناعي</button><button class="opt" style="justify-content:center" onclick="sortA(2)">🪞 ليس مصدرًا (يعكس الضوء)</button><div id="sf" aria-live="polite"></div></div>`)}
function sortA(k){const it=SORT[M.i],ok=k===it[2];document.querySelectorAll('.opt').forEach(b=>b.disabled=true);if(ok){M.ok++;add(5);tone([660,880])}else tone([220,170],.2);
$('sf').innerHTML=`<div class="fb ${ok?'g':'b'}"><b>${ok?pick(WIN):pick(LOSE)}</b><br>${it[2]===2?'القمر يعكس ضوء الشمس!':['طبيعي: يوجد في الطبيعة.','صناعي: صنعه الإنسان.'][it[2]]}</div>`;setTimeout(()=>{M.i++;sortQ()},1300)}
function beam(){M={t:100+Math.floor(Math.random()*70),done:0};show(`${hud()}<div class="card"><h2>🎮 وجّه الشعاع</h2><p>أدِر المرآة لينعكس ضوء الكشّاف على الهدف 🎯 (الضوء ينعكس في خط مستقيم).</p><svg id="bs" viewBox="0 0 300 200" role="img" aria-label="مرآة وكشاف وهدف"><g id="bg"></g></svg><input type="range" id="rg" min="0" max="180" value="90" dir="ltr" oninput="bm(+this.value)" aria-label="زاوية المرآة"><div id="bf" aria-live="polite"></div><button class="alt" onclick="play()">${'تخطَّ'}</button></div>`);bm(90)}
function bm(v){const r=d=>d*Math.PI/180,cx=150,cy=150,a=r(2*v),t=r(2*M.t),tx=cx+120*Math.cos(t),ty=cy+120*Math.sin(t),dx=Math.cos(r(v))*28,dy=Math.sin(r(v))*28,hit=Math.abs(v-M.t)<4;
$('bg').innerHTML=`<text x="6" y="160" font-size="30">🔦</text><line x1="40" y1="150" x2="150" y2="150" stroke="#FFC93C" stroke-width="4"/><line x1="150" y1="150" x2="${cx+220*Math.cos(a)}" y2="${cy+220*Math.sin(a)}" stroke="#FFC93C" stroke-width="4"/><line x1="${cx-dx}" y1="${cy-dy}" x2="${cx+dx}" y2="${cy+dy}" stroke="#bfe9ff" stroke-width="8" stroke-linecap="round"/><text x="${tx-14}" y="${ty+10}" font-size="30">${hit?'🌟':'🎯'}</text>`;
if(hit&&!M.done){M.done=1;tone([523,659,784,1047],.12);confetti(40);add(15);$('bf').innerHTML=`<div class="fb g"><b>أصبت الهدف! ${pick(WIN)}</b><br>غيّرنا اتجاه الضوء بمرآة، وانتقل في خط مستقيم. <button style="margin-top:8px;width:100%" onclick="play()">ابدأ الأسئلة</button></div>`}}
// ===== الأسئلة =====
function play(){const l=L[S.lv];scene(S.lv);Object.assign(S,{qs:shuf(l.qs),qi:0,hearts:S.maxH,ok:0,wrong:0,streak:0,miss:[]});ask()}
function ask(){const q=S.qs[S.qi];S.hint=false;S.locked=false;S.opts=shuf([0,1,2]);
show(`${hud()}<div class="bulbs" aria-label="سؤال ${S.qi+1} من 5">${[0,1,2,3,4].map(i=>`<i class="${i<S.ok?'on':''}">💡</i>`).join('')}</div><div class="tw"><div id="tb" style="width:100%"></div></div>
<div class="card"><div class="muted">${L[S.lv].e} ${L[S.lv].n} · سؤال ${S.qi+1} من 5</div><div class="say"><span id="mas">${mas('happy')}</span><div class="bub" id="say">${esc(q[0])}</div></div>
${S.opts.map((o,n)=>`<button class="opt" id="o${n}" onclick="ans(${n})"><b>${LET[n]}</b>${q[1][o]}</button>`).join('')}
<div style="display:flex;gap:8px"><button class="alt" id="hb" style="flex:1" onclick="hint()">💡 تلميح (${S.pw.hint>0?'مجاني ×'+S.pw.hint:'−3 نقاط'})</button>${S.pw.time>0?`<button class="alt" id="tb2" style="flex:1" onclick="S.t0+=10000;S.pw.time--;this.remove()">⏳ +10 ثوانٍ</button>`:''}</div><div id="fb" aria-live="polite"></div></div>`);
S.t0=Date.now();clearInterval(S.timer);S.timer=setInterval(()=>{const r=Math.min(1,1-(Date.now()-S.t0)/25000);$('tb').style.width=Math.max(r,0)*100+'%';if(r<=0)ans(-1)},100)}
function hint(){if(S.hint||S.locked)return;S.hint=true;if(S.pw.hint>0)S.pw.hint--;else S.score=Math.max(0,S.score-3);const q=S.qs[S.qi],r=pick(S.opts.map((o,n)=>[o,n]).filter(x=>x[0]!==q[2]));$('o'+r[1]).classList.add('gone');$('o'+r[1]).disabled=true;$('hb').disabled=true}
function ans(n){if(S.locked)return;S.locked=true;clearInterval(S.timer);const q=S.qs[S.qi],ok=n>=0&&S.opts[n]===q[2],sec=(Date.now()-S.t0)/1000;
S.opts.forEach((o,k)=>{const b=$('o'+k);b.disabled=true;if(o===q[2]){b.classList.add('good');b.insertAdjacentHTML('beforeend',' ✓ الصحيحة')}});
const tb=$('tb2');if(tb)tb.remove();let msg;
if(ok){S.ok++;S.streak++;let g=10+(sec<=10?5:0);if(S.streak>=3)g*=2;msg=pick(WIN);tone([660,880]);confetti(14);
$('fb').innerHTML=`<div class="fb g"><b>✓ ${msg}</b> +${g} نقطة${sec<=10?' ⚡ سرعة':''}${S.streak>=3?' 🔥 شعلة الكومبو ×2!':''}<br>${q[3]}</div>`;add(g)}
else{S.wrong++;S.hearts--;S.streak=0;S.miss.push(q[0]);msg=n<0?'انتهى الوقت! ولا يهمك.':pick(LOSE);tone([220,170],.2);if(n>=0){$('o'+n).classList.add('bad');$('o'+n).insertAdjacentHTML('beforeend',' ✗')}
$('fb').innerHTML=`<div class="fb b"><b>✗ ${msg}</b><br>${q[3]}</div>`}
$('mas').innerHTML=mas(ok?'cheer':'sad',ok?'hop':'');$('say').textContent=msg;$('hb').remove();
const end=S.hearts<=0||S.qi>=4;$('fb').insertAdjacentHTML('beforeend',`<button style="margin-top:10px;width:100%" onclick="${end?'finish()':'S.qi++;ask()'}">${end?'شوف النتيجة 🎉':'التالي'}</button>`)}
function finish(){const l=L[S.lv],pass=S.ok>=l.need&&S.hearts>0;
if(pass){const st=S.wrong===0?3:S.wrong===1?2:1,first=!S.stars[S.lv];S.stars[S.lv]=Math.max(S.stars[S.lv],st);S.open=Math.min(5,Math.max(S.open,S.lv+2));S.score+=st*20;if(S.score>best){best=S.score;try{localStorage.setItem('lightBest',best)}catch(e){}}
if(S.stars.every(x=>x>0))return final();
confetti();tone([523,659,784,1047],.15);
show(`${hud()}<div class="card" style="align-items:center;text-align:center">${mas('cheer','big hop')}<h1>نجحت في المستوى ${S.lv+1}!</h1><div>${[0,1,2].map(k=>star(k>=st)).join('')}</div><p>أجبت ${S.ok} من 5 · مكافأة النجوم +${st*20} ⭐</p><p><b>شارة جديدة: ${BADGE[S.lv]}</b></p><div class="fb g">💡 هل تعلم؟ ${l.fact}</div><div id="ch"><button class="chest" onclick="chest()" aria-label="افتح الصندوق">🎁</button><p>اضغط لتفتح صندوق الجوائز!</p></div><button onclick="map()">${S.lv<4?'المستوى التالي ▶':'الخريطة'}</button></div>`)}
else{if(S.score>best){best=S.score;try{localStorage.setItem('lightBest',best)}catch(e){}}
tone([300,240,200],.22);show(`${hud()}<div class="card" style="align-items:center;text-align:center">${mas('sad','big')}<h1>لم تنجح هذه المرة</h1><p>أجبت ${S.ok} من 5، والمطلوب ${l.need}. ${pick(LOSE)}</p>${S.miss.length?`<div class="fb b" style="text-align:start"><b>راجع هذه الأسئلة:</b><br>${S.miss.slice(0,3).map(esc).join('<br>')}</div>`:''}<p class="muted">نصيحة: اقرأ البطاقات مرة ثانية، وستنجح بإذن الله 💪</p><button onclick="play()">حاول تاني</button><button class="alt" onclick="lesson(${S.lv})">راجع الدرس</button><button class="alt" onclick="map()">الخريطة</button></div>`)}}
function chest(){const R=[['+25 نقطة ⭐',()=>S.score+=25],['تلميح مجاني 💡',()=>S.pw.hint++],['+10 ثوانٍ ⏳ لسؤال',()=>S.pw.time++],['قلب إضافي ❤️ في المستوى القادم',()=>S.extra=1]],r=pick(R);r[1]();confetti(50);tone([784,988,1319],.12);$('ch').innerHTML=`<div class="art">🎉</div><h2>ربحت: ${r[0]}</h2>`}
function final(){confetti(120);setTimeout(()=>confetti(100),1200);tone([523,659,784,1047,1319],.15);scene(4);
show(`<div class="card cert">${mas('cheer','big hop')}<div class="art">🏆</div><h1>عالِم الضوء الصغير</h1><p>مبروك يا <b>${esc(S.name)}</b>! أنهيت كل مستويات «خصائص الضوء».</p><p>⭐ النجوم: ${ts()} من 15 · النقاط: ${S.score}</p><p class="muted">${BADGE.join(' · ')}</p><p><b>جرّب في البيت:</b> اعكس ضوء الشمس بمرآة إلى هدف في الظل، ولا توجّهه إلى عيون أحد!</p><button onclick="S.score=0;S.stars=[0,0,0,0,0];S.open=1;S.extra=0;S.pw={hint:1,time:1};home()">العب من جديد</button></div>`)}
home();
</script>
</body>
</html>
